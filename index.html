<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Drawing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; padding: 20px; }
        .main-card { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-width: 900px; margin: 0 auto; }
        .card-header-custom { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 20px; border-radius: 15px 15px 0 0; }
        canvas { border: 2px solid #1e3c72; border-radius: 8px; cursor: crosshair; }
        .btn-shape { margin: 5px; }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="card-header-custom">
            <h3 class="mb-1">🎨 Canvas Drawing</h3>
            <p class="mb-0">Click to draw shapes</p>
        </div>
        
        <div class="card-body">
            <div class="mb-3">
                <button class="btn btn-primary btn-shape" onclick="setShape('line')">Line</button>
                <button class="btn btn-success btn-shape" onclick="setShape('rectangle')">Rectangle</button>
                <button class="btn btn-warning btn-shape" onclick="setShape('circle')">Circle</button>
                <button class="btn btn-danger btn-shape" onclick="clearCanvas()">Clear</button>
            </div>
            
            <canvas id="drawingCanvas" width="800" height="400"></canvas>
            
            <div class="mt-3">
                <p class="text-muted">Click on the canvas to draw the selected shape at that position.</p>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        let currentShape = 'line';
        
        // Set shape type
        function setShape(shape) {
            currentShape = shape;
            alert('Shape set to: ' + shape.toUpperCase() + '. Click on canvas to draw.');
        }
        
        // Clear canvas
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        
        // Mouse click event
        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            drawShape(x, y);
        });
        
        function drawShape(x, y) {
            ctx.strokeStyle = '#1e3c72';
            ctx.lineWidth = 3;
            
            switch(currentShape) {
                case 'line':
                    ctx.beginPath();
                    ctx.moveTo(x - 50, y);
                    ctx.lineTo(x + 50, y);
                    ctx.stroke();
                    break;
                    
                case 'rectangle':
                    ctx.strokeRect(x - 40, y - 30, 80, 60);
                    break;
                    
                case 'circle':
                    ctx.beginPath();
                    ctx.arc(x, y, 30, 0, 2 * Math.PI);
                    ctx.stroke();
                    break;
            }
        }
        
        // Initial message
        ctx.font = '20px Arial';
        ctx.fillStyle = '#999';
        ctx.textAlign = 'center';
        ctx.fillText('Select a shape and click here to draw', canvas.width/2, canvas.height/2);
    </script>
</body>
</html>
